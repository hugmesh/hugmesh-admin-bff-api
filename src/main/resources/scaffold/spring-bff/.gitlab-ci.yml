# {{BRAND_TITLE}} CI — build + push this service's container image to the
# in-cluster GitLab container registry (repo pull-mirrored into in-cluster
# GitLab, mirror_trigger_builds=true; privileged x86 shell runner with docker,
# matching the fleet BFF CI). Images carry NO keys.

# Pull in the centralized OWASP pen-test stage (SCA Dependency-Check + ZAP DAST)
# as the hidden `.pentest-*` jobs. ONE source of truth org-wide — the generator
# owns the job bodies; this repo just `extends:` them below.
include:
  - project: '{{GENERATOR_ORG_GROUP}}'
    ref: main
    file: '/tests/pentest/ci/pentest-stage.gitlab-ci.yml'

stages: [test, security, pentest, build]

# ── Maven test (Spring Boot 4) ────────────────────────────────────────────────
# The skeleton's tests boot the full context WITHOUT external services (no
# Testcontainers/dind yet — the skeleton excludes the R2DBC/Liquibase
# auto-configs until real persistence lands; when it does, adopt the exemplar's
# docker:dind service + Testcontainers variables from admin-bff-api).
test:mvn:
  stage: test
  image: maven:3.9-eclipse-temurin-25
  tags: [hugmesh-x86, privileged]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    # settings.xml (committed) resolves the PRIVATE hugmesh-parent from the
    # GitLab Maven registry via CI_JOB_TOKEN.
    - mvn -B -s settings.xml clean test
  artifacts:
    when: always
    reports:
      junit: target/surefire-reports/TEST-*.xml
    paths:
      - target/surefire-reports/
    expire_in: 1 week

build:image:
  stage: build
  tags: [hugmesh-x86, privileged]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  variables:
    # BuildKit is required for the Dockerfile's `--mount=type=secret` private-dep
    # resolution (hugmesh-parent from the GitLab Maven registry).
    DOCKER_BUILDKIT: "1"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # Immutable tag = release tag or git SHA; plus a moving branch tag the deploy/
    # kustomize can track for dev.
    - export TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    # CI_JOB_TOKEN rides as a BuildKit SECRET (never persisted in a layer); the
    # GitLab registry coordinates go in as build-args so the committed
    # settings.xml can resolve the private parent during `mvn package` inside the
    # build stage. GITLAB_GROUP_ID must be set to the org group id (a CI/CD or
    # group variable).
    - |
      docker build --pull \
        --secret id=ci_job_token,env=CI_JOB_TOKEN \
        --build-arg CI_API_V4_URL="$CI_API_V4_URL" \
        --build-arg GITLAB_GROUP_ID="$GITLAB_GROUP_ID" \
        -t "$CI_REGISTRY_IMAGE:$TAG" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" .
    - docker push "$CI_REGISTRY_IMAGE:$TAG"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"

# OWASP SCA (Dependency-Check) + DAST via the shared generator harness.
# Non-blocking; runs on the default branch + merge requests.
pentest:sca:
  extends: .pentest-sca
  stage: security
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

pentest:dast:
  extends: .pentest-dast-baseline
  stage: pentest
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
