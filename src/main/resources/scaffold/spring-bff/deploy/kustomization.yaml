apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hugmesh-backend
resources:
  - deployment.yaml
# First-party images pull from the in-cluster GitLab container registry
# (registry.{{CLUSTER_DOMAIN}}; project path = <group>/<repo>). The CI pushes
# :<branch> + :<sha>; we track the moving :main here for dev. Pulls need the
# gitlab-registry imagePullSecret (ESO-materialized), added by the same patch the
# fleet BFF deploys carry.
images:
  - { name: hugmesh-systems/{{APP_SLUG}}-bff, newName: registry.{{CLUSTER_DOMAIN}}/{{NPM_SCOPE}}/{{APP_SLUG}}-bff, newTag: main }
patches:
  - target: { kind: Deployment }
    patch: |
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: gitlab-registry
