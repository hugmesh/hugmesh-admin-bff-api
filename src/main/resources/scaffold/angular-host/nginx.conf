# ── CSP nonce source (the hugmesh.net host-serving shape) ──────────────
# nginx generates a unique $request_id per request; we reuse it as a fresh,
# unpredictable nonce injected into BOTH the Content-Security-Policy header AND
# every `<script` tag in index.html (sub_filter below), so the inline /
# module-federation bootstrap scripts execute under a strict nonce-CSP without
# 'unsafe-inline'. es-module-shims auto-propagates the document's script nonce
# onto the dynamic remote-entry scripts it injects.
map $request_id $cspnonce {
    default $request_id;
}

server {
    # nginx-unprivileged (see Dockerfile) cannot bind :80 — 8080 is its default
    # unprivileged port; the fleet Service maps 80 -> 8080.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers (defence-in-depth) ───────────────────────────────────
    # Inspection-safe for an Angular SPA + module-federation remotes + OAuth
    # redirect flows: none of these block same-origin scripts, cross-origin
    # script-based federation, or redirect-based login. Emitted with `always` so
    # they also cover error responses.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        # Inject a fresh per-response nonce into every `<script` tag in
        # index.html so the bootstrap / es-module-shims scripts run under the
        # strict nonce-CSP (no 'unsafe-inline' in script-src). sub_filter_once
        # OFF so ALL script tags get the nonce; sub_filter_types restricts
        # rewriting to text/html only — JS/CSS bundles are never touched. (Do
        # NOT enable gzip_static / precompressed index.html: sub_filter cannot
        # rewrite a pre-gzipped response body.)
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '<script' '<script nonce="$cspnonce"';

        # ── Content-Security-Policy (STRONG nonce-CSP) ────────────────────────
        # script-src uses 'self' + per-response 'nonce-$cspnonce' (NO
        # 'unsafe-inline') so only nonce-tagged or same-origin scripts execute.
        # blob: covers worker/wasm script blobs. Same-origin federation remotes
        # (prod manifests use relative fe-gateway paths) are covered by 'self';
        # connect-src https: allows any cross-origin https remote / BFF (wss:
        # for live sockets). style-src keeps 'unsafe-inline' because Angular
        # emits inline component styles. frame-ancestors 'none' matches
        # X-Frame-Options DENY above.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$cspnonce' blob:; style-src 'self' 'unsafe-inline' blob:; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' blob: https: wss:; worker-src 'self' blob:; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
        # Re-assert the other security headers here too: add_header in a nested
        # block REPLACES (does not inherit) the server-level set.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
