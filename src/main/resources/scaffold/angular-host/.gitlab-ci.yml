# {{BRAND_TITLE}} CI — build + push the host-shell container image to the
# in-cluster GitLab container registry (repo pull-mirrored into in-cluster
# GitLab, mirror_trigger_builds=true; privileged x86 shell runner with docker,
# matching the fleet UI CI). Images carry NO keys.

# Pull in the centralized OWASP pen-test stage (SCA + DAST) as hidden `.pentest-*`
# jobs from the generator. ONE source of truth across all onboarded repos; the
# thin `pentest:*` jobs below `extends:` these.
include:
  - project: '{{GENERATOR_ORG_GROUP}}'
    ref: main
    file: '/tests/pentest/ci/pentest-stage.gitlab-ci.yml'

stages: [test, build, pentest]

# The skeleton ships no karma lane yet (see README) — the test-stage gate is an
# honest full `npm ci && npm run build` (a real native-federation host build),
# run inside a disposable node container because the shell runner has docker,
# not node. Swap in the exemplar's karma job when specs land.
test:build-smoke:
  stage: test
  tags: [hugmesh-x86, privileged]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
  script:
    - docker run --rm -v "${CI_PROJECT_DIR}:/workspace:ro" -w /workspace node:24-alpine sh -c "npm ci && npm run build"

build:image:
  stage: build
  needs: [test:build-smoke]
  tags: [hugmesh-x86, privileged]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # Immutable tag = release tag or git SHA; plus a moving branch tag the deploy
    # kustomize can track for dev.
    - export TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - docker build --pull -t "$CI_REGISTRY_IMAGE:$TAG" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" .
    - docker push "$CI_REGISTRY_IMAGE:$TAG"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"

# OWASP SCA + DAST via the shared generator harness. Non-blocking; runs on the
# default branch + merge requests.
pentest:sca:
  extends: .pentest-sca
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

pentest:dast:
  extends: .pentest-dast-baseline
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
