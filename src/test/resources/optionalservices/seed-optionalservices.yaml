  # SAFE TEST BASELINE (optional-services.yaml anubis default:off; PROD flips it on
  # at build via _opt_anubis_installed). The CR is the authoritative runtime override.
  enabled: false
  reason: build-seed (ENV-conditional; safe test baseline)
  requestedBy: generator:_opt_render_optionalservice_cr
---
apiVersion: platform.hugmesh.net/v1alpha1
