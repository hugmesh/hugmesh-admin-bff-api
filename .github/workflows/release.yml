name: Release image

# Manual only, on purpose: this workflow is inert until a human flips it on.
# Never add `push`/`tags` triggers here without an explicit decision to go live.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (defaults to the short commit SHA)'
        required: false
        default: ''

# Mirrors this repo's .gitlab-ci.yml `build:image` job: a multi-stage Docker
# build (Maven package -> JRE runtime) whose build stage resolves the PRIVATE
# net.hugmesh:hugmesh-commons dependency from a Maven registry via the
# committed settings.xml. In GitLab that registry is the in-cluster GitLab
# instance and the credential is CI_JOB_TOKEN; here those become repo/org
# secrets and variables so the same Dockerfile keeps working unmodified.
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: hugmesh-net/hugmesh-admin-bff-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image tag
        id: tag
        run: echo "value=${{ inputs.tag != '' && inputs.tag || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            CI_API_V4_URL=${{ vars.MAVEN_REGISTRY_API_URL }}
            GITLAB_GROUP_ID=${{ vars.MAVEN_REGISTRY_GROUP_ID }}
          # Mirrors the GitLab CI `--secret id=ci_job_token,env=CI_JOB_TOKEN`
          # BuildKit secret: never an ARG/ENV, never persisted in a layer.
          # MAVEN_REGISTRY_TOKEN must be populated as a repo/org secret before
          # this job is ever actually run.
          secrets: |
            ci_job_token=${{ secrets.MAVEN_REGISTRY_TOKEN }}
