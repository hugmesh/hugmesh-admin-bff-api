name: Release image

# Beta release scheme (2026-10-21). What each event publishes:
#   push to main                  -> ghcr image :main and :sha-<12>. No versioned tag.
#   push of tag v<pom version>    -> ghcr image :<version>, :beta and :sha-<12>, plus a GitHub
#                                    Release marked prerelease and not latest.
#   workflow_dispatch on a v* tag -> the same as the tag push (fails if :<version> already exists).
#   workflow_dispatch on main     -> the same as a push to main.
#   anything else                 -> refused by the version job.
# `latest` is never pushed: every version today is a beta, and a beta must never move `latest`.
# A published :<version> is never overwritten: the image job refuses if it already exists.
#
# There is deliberately NO pull_request / pull_request_target trigger. Do not add one: this
# workflow can run on the self-hosted runner, and a pull request must never reach that runner.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Multi-stage Docker build (Maven package -> JRE runtime). The build stage resolves the
# PRIVATE net.hugmesh libraries (hugmesh-parent, hugmesh-build-config, hugmesh-commons,
# hugmesh-auth-core) from GitHub Packages through .github/maven-ci-settings.xml, selected by
# the BuildKit secret `packages_read_token` (see the Dockerfile). Those packages are published
# by the release chain; until it has run, the Preflight step fails by name.
# The repo-root settings.xml (GitLab registry) is NOT used here and is left for GitLab CI and
# the local compose lane.
#
# RUNNER: every job uses the same runs-on expression. It picks the repository variable
# RUNS_ON_PUBLISH (a JSON array such as ["self-hosted","Linux","X64"]) ONLY for a non-PR event
# on main or on a v* / studio-v* tag; everything else, and an unset variable, runs on hosted
# ubuntu-latest. Deleting RUNS_ON_PUBLISH sends every job back to hosted runners.
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: hugmesh/hugmesh-admin-bff-api

jobs:
  version:
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    outputs:
      version: ${{ steps.guard.outputs.version }}
      kind: ${{ steps.guard.outputs.kind }}
      short_sha: ${{ steps.guard.outputs.short_sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # VERSION GUARD. The pom <version> is the only version source. A tag run must be
      # exactly v<pom version>; main builds are allowed; every other ref is refused.
      - name: Version guard
        id: guard
        run: |
          set -euo pipefail
          version=$(python3 -c 'import xml.etree.ElementTree as E; n={"m": "http://maven.apache.org/POM/4.0.0"}; v=E.parse("pom.xml").getroot().find("m:version", n); print(v.text.strip() if v is not None and v.text else "")')
          if [ -z "${version}" ]; then
            echo "::error::pom.xml has no <project><version>."
            exit 1
          fi
          case "${version}" in
            *-SNAPSHOT)
              echo "::error::pom.xml version ${version} is a SNAPSHOT. A published image must carry a release coordinate such as 0.3.0-beta.1."
              exit 1
              ;;
          esac
          if ! printf '%s\n' "${version}" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' >/dev/null; then
            echo "::error::pom.xml version '${version}' is not MAJOR.MINOR.PATCH[-pre]. It is also the image tag, so it must be plain."
            exit 1
          fi
          case "${GITHUB_REF}" in
            refs/tags/v*)
              if [ "${GITHUB_REF_NAME#v}" != "${version}" ]; then
                echo "::error::tag ${GITHUB_REF_NAME} does not match pom.xml version ${version}. Tag the commit whose pom says ${GITHUB_REF_NAME#v}, or fix the pom."
                exit 1
              fi
              kind=release
              ;;
            refs/heads/main)
              kind=main
              ;;
            *)
              echo "::error::refusing to publish from ${GITHUB_REF}. Only main and v<version> tags publish."
              exit 1
              ;;
          esac
          short_sha=${GITHUB_SHA:0:12}
          {
            echo "version=${version}"
            echo "kind=${kind}"
            echo "short_sha=${short_sha}"
          } >> "$GITHUB_OUTPUT"
          echo "publishing kind=${kind} version=${version} sha=${short_sha}"

  build-and-push:
    needs: version
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # PREFLIGHT, cross-repo package read. Fails here, by name, instead of deep inside Maven.
      # The net.hugmesh libraries live in the PRIVATE GitHub Packages registries of the chain
      # repositories. The automatic GITHUB_TOKEN cannot read another repository's package, so
      # this job needs the PACKAGES_READ_TOKEN secret (a classic PAT with read:packages,
      # decision 90a = B in hugmesh-commons/RELEASING.md). There is deliberately NO fall-back to
      # GITHUB_TOKEN: it cannot work, and an unset secret would otherwise select the dead
      # GitLab settings.xml and fail as "Non-resolvable parent POM ... /groups//".
      - name: Preflight, cross-repo package read
        env:
          UPSTREAM_PACKAGES_ACTOR: ${{ secrets.PACKAGES_READ_ACTOR || github.actor }}
          UPSTREAM_PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${UPSTREAM_PACKAGES_TOKEN}" ]; then
            echo "::error::secret PACKAGES_READ_TOKEN is not set for this repository. Set it as a REPOSITORY secret under Settings -> Secrets and variables -> Actions (the org is on the Free plan, where an org secret does not reach private repositories): a classic personal access token with the read:packages scope. The automatic GITHUB_TOKEN cannot read another repository's packages, so there is no fall-back."
            exit 1
          fi
          rc=0
          for upstream in hugmesh-build-config hugmesh-parent hugmesh-commons hugmesh-auth-core; do
            url="https://maven.pkg.github.com/hugmesh/${upstream}/net/hugmesh/${upstream}/maven-metadata.xml"
            code=$(curl -sS -o /dev/null -w '%{http_code}' -u "${UPSTREAM_PACKAGES_ACTOR}:${UPSTREAM_PACKAGES_TOKEN}" "${url}" || echo 000)
            case "${code}" in
              200)
                echo "  readable    hugmesh/${upstream}"
                ;;
              401|403)
                echo "::error::CANNOT AUTHENTICATE to hugmesh/${upstream} (HTTP ${code}). This is NOT 'the upstream is unpublished': PACKAGES_READ_TOKEN cannot read that repository's Maven registry. It must be a classic PAT with read:packages, not expired, from an account that can read the repository."
                rc=1
                ;;
              404)
                echo "::error::NOT READABLE at hugmesh/${upstream} (HTTP 404). Two causes look identical: (a) nothing is published to that registry yet (run the release chain: build-config, parent, commons, auth-core), or (b) it is published and this credential cannot see it, because GitHub masks an unauthorised read of a private package as 404. Look at the package page before re-publishing anything."
                rc=1
                ;;
              *)
                echo "::error::unexpected HTTP ${code} from hugmesh/${upstream}. Not classified, do not assume 'unpublished'."
                rc=1
                ;;
            esac
          done
          exit ${rc}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # IMMUTABLE VERSION TAG. A release run refuses to overwrite an existing :<version>.
      # "Not found" answers mean absent. GHCR also answers "denied" for a package that does
      # not exist yet; this job holds packages: write, so a real denial fails the push anyway.
      # Any other failure (network, 5xx) stops the run instead of guessing.
      - name: Refuse to overwrite a published version
        if: needs.version.outputs.kind == 'release'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -uo pipefail
          ref="${REGISTRY}/${IMAGE_NAME}:${VERSION}"
          out=$(docker buildx imagetools inspect "${ref}" 2>&1)
          rc=$?
          if [ "${rc}" -eq 0 ]; then
            echo "::error::${ref} already exists. A published version is never overwritten: raise N in the pom (for example -beta.2) and tag again."
            exit 1
          fi
          if printf '%s\n' "${out}" | grep -i -E 'not found|manifest unknown|name unknown|denied|unauthorized' >/dev/null; then
            echo "${ref} is not published yet."
            exit 0
          fi
          echo "::error::could not tell whether ${ref} exists (exit ${rc}): ${out}"
          exit 1

      # Tags: a release gets :<version> and :sha-<12>, plus :beta when the version is a
      # pre-release. main gets :main and :sha-<12>. Never :latest.
      - name: Resolve image tags
        id: tags
        env:
          KIND: ${{ needs.version.outputs.kind }}
          VERSION: ${{ needs.version.outputs.version }}
          SHORT_SHA: ${{ needs.version.outputs.short_sha }}
        run: |
          set -euo pipefail
          base="${REGISTRY}/${IMAGE_NAME}"
          if [ "${KIND}" = release ]; then
            label_version="${VERSION}"
            tags="${base}:${VERSION},${base}:sha-${SHORT_SHA}"
            case "${VERSION}" in
              *-*) tags="${tags},${base}:beta" ;;
            esac
          else
            label_version=main
            tags="${base}:main,${base}:sha-${SHORT_SHA}"
          fi
          {
            echo "tags=${tags}"
            echo "label_version=${label_version}"
          } >> "$GITHUB_OUTPUT"
          echo "tags: ${tags}"

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tags.outputs.label_version }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            UPSTREAM_PACKAGES_ACTOR=${{ secrets.PACKAGES_READ_ACTOR || github.actor }}
          # BuildKit secret, never an ARG/ENV, never persisted in a layer.
          secrets: |
            packages_read_token=${{ secrets.PACKAGES_READ_TOKEN }}

  github-release:
    needs: [version, build-and-push]
    if: needs.version.outputs.kind == 'release'
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    permissions:
      contents: write
    steps:
      - name: Create the GitHub Release (prerelease and never latest for a beta)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; leaving it as it is."
            exit 0
          fi
          flags=(--verify-tag --title "${GITHUB_REF_NAME}")
          case "${VERSION}" in
            *-*) flags+=(--prerelease --latest=false) ;;
          esac
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" "${flags[@]}" \
            --notes "Container image: ${REGISTRY}/${IMAGE_NAME}:${VERSION}"
