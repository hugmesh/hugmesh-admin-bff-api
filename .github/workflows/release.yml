name: Release image

# Manual only, on purpose: this workflow is inert until a human flips it on.
# Never add `push`/`tags` triggers here without an explicit decision to go live.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (defaults to the full commit SHA)'
        required: false
        default: ''

# A multi-stage Docker build (Maven package -> JRE runtime) whose build stage resolves the
# PRIVATE net.hugmesh:hugmesh-parent / hugmesh-commons artifacts.
#
# REGISTRY: GitHub Packages (maven.pkg.github.com/hugmesh/*), through
# .github/maven-ci-settings.xml, selected by the Dockerfile when the BuildKit secret
# `packages_read_token` is mounted. This used to feed the GitLab contract (vars.MAVEN_REGISTRY_*
# / secrets.MAVEN_REGISTRY_TOKEN, none of which existed, aimed at the in-cluster GitLab that
# GitHub cannot reach); run 37682448800 died on
#   Non-resolvable parent POM ... net.hugmesh:hugmesh-parent:pom:2.8.0 (absent):
#   Could not transfer artifact ... from/to gitlab-maven (/groups//-/packages/maven)
# The repo-root settings.xml and the Dockerfile's ci_job_token mount are untouched: GitLab CI
# and the local compose/kind lane still use them.
#
# OPERATOR-HELD PREREQUISITE: the PACKAGES_READ_TOKEN secret (classic PAT, read:packages, see
# hugmesh-auth-core/RELEASING.md 6.1/6.2) and the chain packages being published. Without them
# the preflight step below fails by name. Nothing here can be made green by editing this file.
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: hugmesh/hugmesh-admin-bff-api

jobs:
  build-and-push:
    # RUNS_ON is a repo variable (a JSON array of labels); ubuntu-latest when unset.
    runs-on: ${{ fromJSON(vars.RUNS_ON || '["ubuntu-latest"]') }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # PREFLIGHT - CROSS-REPO PACKAGE READ. Runs BEFORE the image build so a missing
      # credential fails here, by name, and not 40 seconds later inside Maven as
      # "Non-resolvable parent POM for net.hugmesh:...:hugmesh-parent:pom:<v> (absent)".
      #
      # The image build resolves net.hugmesh:hugmesh-parent and hugmesh-commons, which are
      # published from OTHER private repositories to GitHub Packages. The automatic
      # GITHUB_TOKEN is scoped to THIS repository and does not read those packages; the
      # supported route (hugmesh-auth-core/RELEASING.md 6.1/6.2, decision 90a=B) is the
      # PACKAGES_READ_TOKEN secret: a classic PAT carrying read:packages, stored as a
      # REPOSITORY secret on this repo (an org secret cannot be shared with private repos on
      # the Free plan). The GITHUB_TOKEN fallback below only keeps the step runnable; the
      # preflight reports when it cannot read the upstream. A 200 proves this runner can read that
      # upstream's registry; it does not prove the pinned version exists - Maven says that.
      - name: Preflight - cross-repo package read
        env:
          UPSTREAM_PACKAGES_ACTOR: ${{ secrets.PACKAGES_READ_ACTOR || github.actor }}
          UPSTREAM_PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN != '' }}
        run: |
          set -uo pipefail
          command -v curl >/dev/null 2>&1 || { echo "::error::curl is not on this runner; the preflight cannot probe the registries."; exit 1; }
          if [ "${HAS_PACKAGES_READ_TOKEN}" = "true" ]; then
            echo "read credential: secrets.PACKAGES_READ_TOKEN (operator-held PAT)"
          else
            echo "read credential: the automatic secrets.GITHUB_TOKEN (PACKAGES_READ_TOKEN is not set)."
            echo "That token is scoped to THIS repository and may not read the upstream packages."
            echo "Set the PACKAGES_READ_TOKEN repository secret (classic PAT, read:packages). If the"
            echo "probe below fails, it says so explicitly."
          fi
          rc=0
          for upstream in hugmesh-parent hugmesh-commons; do
            url="https://maven.pkg.github.com/hugmesh/${upstream}/net/hugmesh/${upstream}/maven-metadata.xml"
            code=$(curl -sS -o /dev/null -w '%{http_code}' -u "${UPSTREAM_PACKAGES_ACTOR}:${UPSTREAM_PACKAGES_TOKEN}" "${url}" || echo 000)
            case "${code}" in
              200)
                echo "  readable    hugmesh/${upstream}"
                ;;
              401|403)
                echo "::error::CANNOT AUTHENTICATE to hugmesh/${upstream} (HTTP ${code}). This is NOT 'the upstream is unpublished'. This runner's credential cannot read that repository's Maven registry. Fix: set the PACKAGES_READ_TOKEN repository secret on this repo (classic PAT with read:packages; hugmesh-auth-core/RELEASING.md 6.2)."
                rc=1
                ;;
              404)
                echo "::error::NOT READABLE at hugmesh/${upstream} (HTTP 404). Two causes look identical: (a) nothing is published to that registry yet - publish the chain in order (build-config, parent, commons, auth-core); or (b) it IS published and this credential cannot see it, because GitHub masks an unauthorised read of a private package as 404. Look at the package page before re-publishing anything."
                rc=1
                ;;
              *)
                echo "::error::unexpected HTTP ${code} from hugmesh/${upstream}. Not classified - do not assume 'unpublished'."
                rc=1
                ;;
            esac
          done
          exit ${rc}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image tag
        id: tag
        run: echo "value=${{ inputs.tag != '' && inputs.tag || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v5
        env:
          # build-push-action v6+ uploads a build-record artifact holding the raw BuildKit
          # logs, which runner-side secret masking does not cover. Off, so a token can never
          # reach an artifact. (A no-op on the v5 pinned here; kept so a bump stays safe.)
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          push: true
          # :latest only from the default branch (or a tag): a --ref dispatch of an
          # unmerged branch must not move :latest.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}
            ${{ (github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch) && format('{0}/{1}:latest', env.REGISTRY, env.IMAGE_NAME) || '' }}
          build-args: |
            UPSTREAM_PACKAGES_ACTOR=${{ secrets.PACKAGES_READ_ACTOR || github.actor }}
          # BuildKit secret, never an ARG/ENV, never persisted in a layer. The Dockerfile
          # switches to .github/maven-ci-settings.xml when this secret is present.
          secrets: |
            packages_read_token=${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
