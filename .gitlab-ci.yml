# HugMesh CI — build + push this service's container image to the in-cluster
# GitLab container registry. The GitHub repo is pull-mirrored into in-cluster
# GitLab (mirror_trigger_builds=true), so this runs on push / mirror-sync on the
# privileged x86 runner (shell executor with docker, matching the generator CI).
# Images carry NO keys — KEYS material is supplied from the USB at first boot.

# Pull in the centralized OWASP pen-test stage (SCA Dependency-Check + ZAP DAST)
# as the hidden `.pentest-*` jobs. ONE source of truth org-wide — the generator
# owns the job bodies; this repo just `extends:` them below. See memory
# hugmesh-pentest-standard ("a stage in every ArgoCD-onboarded repo's pipeline").
include:
  - project: 'HugMesh/hugmesh-generator'
    ref: main
    file: '/tests/pentest/ci/pentest-stage.gitlab-ci.yml'

stages: [test, security, pentest, build]

# ── Maven test (Spring Boot 4 + Testcontainers) ───────────────────────────────
# The Boot-4 upgrade moved the full-context HTTP/repository tests onto a real
# Postgres via Testcontainers (hugmesh-commons PostgresTestSupport). The runner
# therefore needs a Docker daemon: a docker:dind SERVICE gives the build container a
# reachable socket, and Testcontainers talks to it over DOCKER_HOST. Ryuk (the
# resource-reaper) is disabled because dind tears the job's containers down at job
# end anyway and Ryuk needs extra socket privileges. The -Dapi.version=1.43 sysprop
# (via MAVEN_OPTS) pins docker-java's API negotiation — the org runner's docker-java
# needs the explicit sysprop (env DOCKER_API_VERSION does NOT take). Mirrors the
# federation #43 pattern.
test:mvn:
  stage: test
  image: maven:3.9-eclipse-temurin-25
  tags: [hugmesh-x86, privileged]
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_RYUK_DISABLED: "true"
    TESTCONTAINERS_HOST_OVERRIDE: "docker"
    MAVEN_OPTS: "-Dapi.version=1.43"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    # settings.xml (committed) resolves the PRIVATE hugmesh-parent + hugmesh-commons
    # (incl. the tests classifier) from the GitLab Maven registry via CI_JOB_TOKEN.
    - ./mvnw -B -s settings.xml clean test
  artifacts:
    when: always
    reports:
      junit: target/surefire-reports/TEST-*.xml
    paths:
      - target/surefire-reports/
    expire_in: 1 week

build:image:
  stage: build
  tags: [hugmesh-x86, privileged]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  variables:
    # BuildKit is required for the Dockerfile's `--mount=type=secret` private-dep
    # resolution (hugmesh-commons from the GitLab Maven registry).
    DOCKER_BUILDKIT: "1"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # Immutable tag = release tag or git SHA; plus a moving branch tag the deploy/
    # kustomize can track for dev.
    - export TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    # CI_JOB_TOKEN is passed as a BuildKit SECRET (never persisted in a layer); the
    # GitLab registry coordinates go in as build-args so the committed settings.xml
    # can resolve the PRIVATE hugmesh-commons artifact during `./mvnw package`
    # inside the build stage. GITLAB_GROUP_ID must be set to the HugMesh
    # group id (a CI/CD or group variable).
    - |
      docker build --pull \
        --secret id=ci_job_token,env=CI_JOB_TOKEN \
        --build-arg CI_API_V4_URL="$CI_API_V4_URL" \
        --build-arg GITLAB_GROUP_ID="$GITLAB_GROUP_ID" \
        -t "$CI_REGISTRY_IMAGE:$TAG" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" .
    - docker push "$CI_REGISTRY_IMAGE:$TAG"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"

# OWASP SCA (Dependency-Check) over this repo. MIGRATED from the previous inline
# `dependency-check` job to the centralized `.pentest-sca` so the SCA scan + the
# DAST harness share ONE source of truth in the generator. Same posture: runs on
# the default branch + merge requests, non-blocking (allow_failure).
pentest:sca:
  extends: .pentest-sca
  stage: security
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# OWASP DAST (authenticated ZAP baseline + custom probes + nuclei) via the shared
# generator harness. Non-blocking; runs on the default branch + merge requests.
pentest:dast:
  extends: .pentest-dast-baseline
  stage: pentest
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
