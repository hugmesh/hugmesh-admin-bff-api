# HugMesh CI — build + push this service's container image to the in-cluster
# GitLab container registry. The GitHub repo is pull-mirrored into in-cluster
# GitLab (mirror_trigger_builds=true), so this runs on push / mirror-sync on the
# privileged x86 runner (shell executor with docker, matching the generator CI).
# Images carry NO keys — KEYS material is supplied from the USB at first boot.

# Pull in the centralized OWASP pen-test stage (SCA Dependency-Check + ZAP DAST)
# as the hidden `.pentest-*` jobs. ONE source of truth org-wide — the generator
# owns the job bodies; this repo just `extends:` them below. See memory
# hugmesh-pentest-standard ("a stage in every ArgoCD-onboarded repo's pipeline").
# `project:` is the GitLab namespace PATH — the lowercase org slug the mirror
# creates the group under, never the brand title. Keep it byte-exact: the
# generator's spring-bff archetype anchors its CI-include rewrite on this
# literal, so a re-cased slug makes that anchor miss and the tenant render abort.
include:
  - project: 'hugmesh/hugmesh-generator'
    ref: main
    file: '/tests/pentest/ci/pentest-stage.gitlab-ci.yml'

stages: [test, security, pentest, build]

# ── Maven test (Spring Boot 4 + Testcontainers) ───────────────────────────────
# The Boot-4 upgrade moved the full-context HTTP/repository tests onto a real
# Postgres via Testcontainers (hugmesh-commons PostgresTestSupport). The runner
# therefore needs a Docker daemon: a docker:dind SERVICE gives the build container a
# reachable socket, and Testcontainers talks to it over DOCKER_HOST. Ryuk (the
# resource-reaper) is disabled because dind tears the job's containers down at job
# end anyway and Ryuk needs extra socket privileges. The -Dapi.version=1.43 sysprop
# (via MAVEN_OPTS) pins docker-java's API negotiation — the org runner's docker-java
# needs the explicit sysprop (env DOCKER_API_VERSION does NOT take). Mirrors the
# federation #43 pattern.
test:mvn:
  stage: test
  image: maven:3.9-eclipse-temurin-25
  tags: [hugmesh-x86, privileged]
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_RYUK_DISABLED: "true"
    TESTCONTAINERS_HOST_OVERRIDE: "docker"
    MAVEN_OPTS: "-Dapi.version=1.43"
    # The generator carries the CANONICAL image-gen catalogs; src/main/resources/catalog/*.json
    # here are a vendored copy. Same cross-repo shape as the generator's layer-a-headscale-acl
    # job, which clones THIS repo for the mirror half of that contract.
    CATALOG_GENERATOR_REF: "main"
    CATALOG_SIBLING_ROOT: "${CI_PROJECT_DIR}/.catalog-sibling"
    # The CONSOLE half of the app-profile schema contract (operator decision 37, issue #55).
    # src/main/resources/schema/app-profile.schema.json here must stay BYTE-IDENTICAL to
    # schemas/app-profile.schema.json in hugmesh-superadmin-service-catalog-ui. Same
    # sibling-clone shape as the catalog above, for the same reason: the guard is worthless
    # unless CI can read the other repo.
    CONSOLE_SCHEMA_REF: "main"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    # WHY THIS CLONE EXISTS: ImageCatalogDriftTest assumeTrue()-SKIPS when the generator source
    # is absent. pom.xml defaults catalog.source.dir to ${project.basedir}/../hugmesh-generator,
    # which resolves to a real sibling checkout on a developer machine but to NOTHING in CI,
    # where only this repo is cloned. So that drift guard has never once run here — it is green
    # locally and dark in the pipeline, which is the worst of both.
    - ORG_BASE="$(dirname "${CI_REPOSITORY_URL}")"
    - mkdir -p "${CATALOG_SIBLING_ROOT}"
    - git clone --depth 1 --branch "${CATALOG_GENERATOR_REF}" "${ORG_BASE}/hugmesh-generator.git" "${CATALOG_SIBLING_ROOT}/hugmesh-generator"
    # A FAILED CLONE MUST NOT LOOK LIKE A PASS. Without this, a missing source dir sends the
    # drift test straight back to its SKIP branch and the job goes green while checking nothing
    # — the exact failure this change exists to end. Assert the file by name.
    - test -f "${CATALOG_SIBLING_ROOT}/hugmesh-generator/docs/catalog/image-catalog.json"
      || { echo "CATALOG SOURCE MISSING — the drift test would SKIP and this job would be green while blind"; exit 1; }
    # THE SAME TRAP, SECOND INSTANCE. AppProfileSchemaMirrorTest compares this repo's
    # app-profile schema against the CONSOLE's copy byte for byte, and assumeTrue()-SKIPS when
    # the console checkout is absent — which, without this clone, is always, in CI. A sha256
    # LITERAL is not a substitute: a one-sided edit that moves the schema and the literal
    # together in ONE repo satisfies both repos' local pins while the two files diverge (this
    # was measured, not theorised). Only reading the other file catches it.
    - git clone --depth 1 --branch "${CONSOLE_SCHEMA_REF}" "${ORG_BASE}/hugmesh-superadmin-service-catalog-ui.git" "${CATALOG_SIBLING_ROOT}/hugmesh-superadmin-service-catalog-ui"
    - test -f "${CATALOG_SIBLING_ROOT}/hugmesh-superadmin-service-catalog-ui/schemas/app-profile.schema.json"
      || { echo "CONSOLE SCHEMA MISSING - the mirror check would SKIP and this job would be green while blind"; exit 1; }
  script:
    # settings.xml (committed) resolves the PRIVATE hugmesh-parent + hugmesh-commons
    # (incl. the tests classifier) from the GitLab Maven registry via CI_JOB_TOKEN.
    # -Dcatalog.source.dir points the drift test at the clone. Deliberately NOT -Pcatalog-copy:
    # in CI the committed copy must be ASSERTED, never silently refreshed into agreement.
    # NO -Dopenapi.spec.write here, deliberately: OpenApiSpecDumpTest now ASSERTS the committed
    # src/main/resources/openapi/openapi.json by default and only rewrites it when that flag is
    # passed. It used to be the reverse, and nothing ever set the old opt-in check flag — so every
    # run rewrote the contract into a discarded CI workspace and went green while the committed
    # spec drifted.
    # -Dappprofile.schema.mirror.required=true turns the mirror check's SKIP into a FAILURE, so
    # a clone that silently failed cannot leave the job green while checking nothing. Belt and
    # braces with the `test -f` above: the flag catches the case where the file exists but the
    # path is wrong, the `test -f` catches it before Maven even starts.
    - ./mvnw -B -s settings.xml clean test -Dcatalog.source.dir="${CATALOG_SIBLING_ROOT}/hugmesh-generator/docs/catalog"
      -Dappprofile.schema.console.dir="${CATALOG_SIBLING_ROOT}/hugmesh-superadmin-service-catalog-ui/schemas"
      -Dappprofile.schema.mirror.required=true
    # THE GENERAL FORM OF THAT BUG: any test that regenerates a COMMITTED artefact passes by
    # rewriting it, and in a throwaway CI workspace nobody ever sees the diff. Both known cases
    # (the vendored catalogs and the OpenAPI spec) now assert instead of writing — this catches
    # the NEXT one without knowing what it is. A clean tree after `clean test` is the invariant;
    # a dirty one means the build silently disagreed with something that is checked in.
    - git diff --exit-code
      || { echo "BUILD REWROTE A COMMITTED FILE (see the diff above) — a test regenerated a checked-in artefact instead of asserting it. Regenerate locally and commit, or make that test assert."; exit 1; }
  artifacts:
    when: always
    reports:
      junit: target/surefire-reports/TEST-*.xml
    paths:
      - target/surefire-reports/
    expire_in: 1 week

build:image:
  stage: build
  tags: [hugmesh-x86, privileged]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  variables:
    # BuildKit is required for the Dockerfile's `--mount=type=secret` private-dep
    # resolution (hugmesh-commons from the GitLab Maven registry).
    DOCKER_BUILDKIT: "1"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # Immutable tag = release tag or git SHA; plus a moving branch tag the deploy/
    # kustomize can track for dev.
    - export TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    # CI_JOB_TOKEN is passed as a BuildKit SECRET (never persisted in a layer); the
    # GitLab registry coordinates go in as build-args so the committed settings.xml
    # can resolve the PRIVATE hugmesh-commons artifact during `./mvnw package`
    # inside the build stage. GITLAB_GROUP_ID must be set to the HugMesh
    # group id (a CI/CD or group variable).
    - |
      docker build --pull \
        --secret id=ci_job_token,env=CI_JOB_TOKEN \
        --build-arg CI_API_V4_URL="$CI_API_V4_URL" \
        --build-arg GITLAB_GROUP_ID="$GITLAB_GROUP_ID" \
        -t "$CI_REGISTRY_IMAGE:$TAG" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" .
    - docker push "$CI_REGISTRY_IMAGE:$TAG"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"

# OWASP SCA (Dependency-Check) over this repo. MIGRATED from the previous inline
# `dependency-check` job to the centralized `.pentest-sca` so the SCA scan + the
# DAST harness share ONE source of truth in the generator. Same posture: runs on
# the default branch + merge requests, non-blocking (allow_failure).
pentest:sca:
  extends: .pentest-sca
  stage: security
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# OWASP DAST (authenticated ZAP baseline + custom probes + nuclei) via the shared
# generator harness. Non-blocking; runs on the default branch + merge requests.
pentest:dast:
  extends: .pentest-dast-baseline
  stage: pentest
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
